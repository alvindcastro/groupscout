# GroupScout runtime: base Compose file.
#
#   docker-compose.yml               services, local build, healthchecks, pinned images; no host ports
#   docker-compose.override.yml      dev host ports (auto-loaded when no -f flag is given)
#   deploy/compose/compose.prod.yml  production: registry image, no build; use with -f
#
# Profiles: core services (postgres, groupscout, alertd, n8n) always run.
#   llm = ollama + ollama-init     obs = prometheus, grafana, loki, promtail
# COMPOSE_PROFILES=llm,obs starts everything (the Makefile default).
#
# Images are pinned to explicit versions. Bump them deliberately: n8n and
# Grafana migrate their databases forward and cannot be downgraded.

name: groupscout

x-local-build: &local-build
  context: .
  args:
    VERSION: ${GROUPSCOUT_VERSION:-dev}   # `make docker-up` passes the git SHA

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  groupscout:
    image: ${GROUPSCOUT_IMAGE:-groupscout}:${GROUPSCOUT_IMAGE_TAG:-local}
    build: *local-build
    container_name: groupscout_app
    networks:
      - groupscout_net
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
        required: false
      ollama-init:
        condition: service_completed_successfully
        required: false
    environment:
      - DATABASE_URL=postgres://groupscout:${POSTGRES_PASSWORD:-groupscout}@postgres:5432/groupscout
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - LEAD_NOTIFY_EMAILS=${LEAD_NOTIFY_EMAILS:-alvin.dcastro@gmail.com}
      # onboarding@resend.dev works without domain verification but only delivers to the
      # Resend account owner's address. To email other recipients, verify a domain in
      # Resend and set EMAIL_FROM (e.g. "GroupScout <alerts@groupscout.ai>").
      - EMAIL_FROM=${EMAIL_FROM:-GroupScout <onboarding@resend.dev>}
      - API_TOKEN=${API_TOKEN:-}
      - RICHMOND_PERMITS_URL=${RICHMOND_PERMITS_URL:-}
      - DELTA_PERMITS_URL=${DELTA_PERMITS_URL:-}
      - CREATIVEBC_ENABLED=true
      - CREATIVEBC_URL=https://www.creativebc.com/search-projects/in-production/
      - VCC_ENABLED=true
      - VCC_URL=https://www.vancouverconventioncentre.com/events
      - BCBID_ENABLED=true
      - NEWS_ENABLED=true
      - ANNOUNCEMENTS_ENABLED=true
      - EVENTBRITE_ENABLED=true
      - MIN_PERMIT_VALUE_CAD=500000
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-true}
      - OLLAMA_ENDPOINT=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
      - AUDIT_RETENTION_ENABLED=${AUDIT_RETENTION_ENABLED:-false}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-30}
      - AUDIT_RETENTION_INTERVAL_HOURS=${AUDIT_RETENTION_INTERVAL_HOURS:-24}
      - AUDIT_RETENTION_RUN_ON_START=${AUDIT_RETENTION_RUN_ON_START:-true}
      - JSON_LOG=${JSON_LOG:-false}
      - SENTRY_DSN=${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s   # migrations run on startup
    logging: *default-logging
    restart: unless-stopped

  alertd:
    image: ${GROUPSCOUT_IMAGE:-groupscout}:${GROUPSCOUT_IMAGE_TAG:-local}
    build: *local-build
    container_name: groupscout_alertd
    command: ["./alertd"]
    volumes:
      - ./config:/app/config:ro
    networks:
      - groupscout_net
    # Only the variables alertd reads (cmd/alertd/main.go); it never sees the
    # pipeline's API keys.
    environment:
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - ALERTD_PORT=8081
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-true}
      - OLLAMA_ENDPOINT=http://ollama:11434
      - OLLAMA_ALERT_COPY_ENABLED=${OLLAMA_ALERT_COPY_ENABLED:-false}
      - OLLAMA_ALERT_COPY_TIMEOUT_S=${OLLAMA_ALERT_COPY_TIMEOUT_S:-15}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  postgres:
    # -bookworm is explicit: a silent switch to a trixie base changes glibc
    # collation under the existing data directory.
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    container_name: groupscout_postgres
    environment:
      - POSTGRES_DB=groupscout
      - POSTGRES_USER=groupscout
      # Only applied when the data volume is first initialised. To rotate on an
      # existing volume, ALTER USER groupscout PASSWORD '...' as well.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-groupscout}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - groupscout_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groupscout -d groupscout"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.43.5
    container_name: groupscout_n8n
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - groupscout_net
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Blank keeps the key n8n generated inside n8n_data. Once set it must match
      # that key, or n8n refuses to start ("Mismatching encryption keys").
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-}
      - GENERIC_TIMEZONE=America/Vancouver
      - TZ=America/Vancouver
      - GROUPSCOUT_API_BASE_URL=http://groupscout:8080
      - GROUPSCOUT_API_TOKEN=${API_TOKEN:-}
      - GROUPSCOUT_OPS_SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: groupscout_prometheus
    profiles: ["obs"]
    volumes:
      - prometheus_data:/prometheus
    networks:
      - groupscout_net
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    container_name: groupscout_grafana
    profiles: ["obs"]
    environment:
      # Only applied when grafana_data is first initialised.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - groupscout_net
    logging: *default-logging
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8
    container_name: groupscout_loki
    profiles: ["obs"]
    networks:
      - groupscout_net
    logging: *default-logging
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.6.11
    container_name: groupscout_promtail
    profiles: ["obs"]
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/promtail.yaml:/etc/promtail/promtail.yaml:ro
    command: -config.file=/etc/promtail/promtail.yaml
    networks:
      - groupscout_net
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      - loki

  ollama:
    image: ollama/ollama:0.40.4
    container_name: groupscout_ollama
    profiles: ["llm"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - groupscout_net
    # Never published to the host outside local debugging (see the dev override).
    mem_limit: 12g
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s   # models may be loading on first start
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging: *default-logging

  ollama-init:
    image: ollama/ollama:0.40.4
    container_name: groupscout_ollama_init
    profiles: ["llm"]
    restart: "no"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - groupscout_net
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama runtime..."
        until OLLAMA_HOST=http://ollama:11434 ollama list > /dev/null 2>&1; do
          sleep 3
        done
        echo "Pulling mistral (required)..."
        OLLAMA_HOST=http://ollama:11434 ollama pull mistral
        echo "Pulling llama3.1:8b (optional, alert copy)..."
        OLLAMA_HOST=http://ollama:11434 ollama pull llama3.1:8b
        echo "Pulling phi3:mini (fallback)..."
        OLLAMA_HOST=http://ollama:11434 ollama pull phi3:mini
        echo "Model pull complete."
    depends_on:
      ollama:
        condition: service_healthy
    logging: *default-logging

volumes:
  pgdata:
  n8n_data:
  prometheus_data:
  grafana_data:
  ollama_data:
    name: groupscout_ollama_data

networks:
  groupscout_net:
    driver: bridge
