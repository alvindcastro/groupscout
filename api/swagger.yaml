openapi: 3.0.3
info:
  title: GroupScout API
  description: API for managing lead collection, enrichment, and notification.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Lead Generation Server (default)
  - url: http://localhost:8081
    description: Alerting Service (alertd)
paths:
  /health:
    get:
      summary: Health check
      description: Returns the status of the server, database connection, and Ollama availability.
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  value:
                    status: ok
                    database: ok
                    ollama: unavailable
        '503':
          description: Database connection failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                databaseError:
                  value:
                    status: error
                    database: error
                    ollama: unavailable
  /run:
    post:
      summary: Trigger pipeline
      description: Manually triggers the collect-enrich-notify pipeline. When guarantee_one_lead is true or a cadence key is present, the backend sends or deduplicates all eligible cadence leads.
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bcbid_raw_input:
                  type: string
                  description: Optional raw input for BC Bid collector.
                guarantee_one_lead:
                  type: boolean
                  description: Send eligible cadence leads with delivery idempotency.
                delivery_mode:
                  type: string
                  enum: [all_eligible, one_lead, exactly_one]
                cadence_key:
                  type: string
                  description: Stable cadence key, for example lead-cadence:2026-05-27:wednesday.
                idempotency_key:
                  type: string
                  description: Stable retry key; defaults to cadence_key when omitted.
                schedule_key:
                  type: string
                  description: Optional display/audit key for the scheduled cadence.
      responses:
        '200':
          description: Pipeline completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    description: Human-readable, ready-to-post summary of the run (suitable for posting verbatim to Slack).
                    example: "📭 No new leads for Thursday, 2026-06-25. GroupScout ran cleanly — every current lead has already been delivered, so there was nothing fresh to send."
                  new_leads:
                    type: integer
                  notified_leads:
                    type: integer
                  delivery_status:
                    type: string
                    enum: [sent, duplicate, no_eligible_lead, locked, failed]
                  delivered_lead_id:
                    type: string
                  delivered_lead_ids:
                    type: array
                    items:
                      type: string
                  idempotency_key:
                    type: string
                  schedule_key:
                    type: string
                  delivery_duplicate:
                    type: boolean
        '401':
          description: Unauthorized
        '500':
          description: Pipeline execution failed
  /ingest:
    post:
      summary: Ingest and enrich one project
      description: Accepts one normalized event payload from n8n or another external source, stores the raw audit payload, runs the single-item enrichment pipeline, and deduplicates by payload hash.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestProject'
      responses:
        '201':
          description: Project accepted and a lead record was inserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '200':
          description: Project was accepted but skipped as a duplicate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          description: Invalid JSON body or empty project payload
        '401':
          description: Unauthorized
        '500':
          description: Ingest enrichment failed
  /digest:
    post:
      summary: Trigger weekly digest
      description: Sends a weekly digest of leads via email.
      security:
        - BearerAuth: []
      parameters:
        - name: to
          in: query
          description: Recipient email address (defaults to alvin@groupscout.ai)
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Digest sent successfully
        '401':
          description: Unauthorized
        '500':
          description: Failed to send digest
  /n8n/webhook:
    post:
      summary: Receive lead from n8n
      description: Endpoint for n8n to push new leads into the system.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lead'
      responses:
        '201':
          description: Lead created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  id:
                    type: string
        '400':
          description: Invalid JSON body
        '401':
          description: Unauthorized
        '500':
          description: Failed to store lead
  /slack/inventory:
    post:
      summary: Update room inventory (Slack Slash Command)
      description: Receives a numeric room count update from a Slack slash command.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Numeric room count (as a string from Slack form)
      responses:
        '200':
          description: Inventory updated successfully
        '400':
          description: Invalid room count or form parse failure
        '405':
          description: Method not allowed
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - database
        - ollama
      properties:
        status:
          type: string
          enum: [ok, error]
          description: Overall API health.
        database:
          type: string
          enum: [ok, error]
          description: Database ping result.
        ollama:
          type: string
          enum: [ok, degraded, unavailable]
          description: Ollama health when enabled, or unavailable when disabled.
    IngestProject:
      type: object
      required:
        - title
      properties:
        source:
          type: string
          description: External source name. Defaults to api.
          example: n8n
        external_id:
          type: string
          description: Stable ID from the upstream system.
          example: evt-123
        title:
          type: string
          description: Project title or lead headline.
          example: Richmond warehouse infrastructure
        location:
          type: string
          example: Richmond BC
        value:
          type: integer
          format: int64
          description: Project value in CAD.
        project_value:
          type: integer
          format: int64
          description: Alias for value.
        description:
          type: string
          description: Text sent to the enrichment model when raw_data is omitted.
        issued_at:
          type: string
          format: date-time
        source_url:
          type: string
          format: uri
        raw_data:
          type: string
          description: Original upstream payload or extracted source text to preserve in the audit trail.
        raw_type:
          type: string
          description: MIME type for raw_data. Defaults to text/plain.
          example: application/json
        metadata:
          type: object
          additionalProperties: true
    IngestResponse:
      type: object
      properties:
        status:
          type: string
          enum: [created, duplicate]
        inserted:
          type: boolean
        source:
          type: string
        external_id:
          type: string
    Lead:
      type: object
      properties:
        ID:
          type: string
          format: uuid
        RawProjectID:
          type: string
        Source:
          type: string
        Title:
          type: string
        Location:
          type: string
        ProjectValue:
          type: integer
          format: int64
        GeneralContractor:
          type: string
        Applicant:
          type: string
        Contractor:
          type: string
        SourceURL:
          type: string
          format: uri
        ProjectType:
          type: string
        EstimatedCrewSize:
          type: integer
        EstimatedDurationMonths:
          type: integer
        OutOfTownCrewLikely:
          type: boolean
        PriorityScore:
          type: integer
          minimum: 0
          maximum: 10
          description: Relevance score on the Slack/internal 0-10 scale. Legacy 0-100 webhook inputs are normalized before storage and Slack delivery.
        PriorityReason:
          type: string
        SuggestedOutreachTiming:
          type: string
        Notes:
          type: string
        Status:
          type: string
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
