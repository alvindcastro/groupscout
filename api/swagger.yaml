openapi: 3.0.3
info:
  title: GroupScout API
  description: API for managing lead collection, enrichment, and notification.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Lead Generation Server (default)
  - url: http://localhost:8081
    description: Alerting Service (alertd)
paths:
  /health:
    get:
      summary: Health check
      description: Returns the status of the server and database connection.
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Database connection failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /run:
    post:
      summary: Trigger pipeline
      description: Manually triggers the collect-enrich-notify pipeline.
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bcbid_raw_input:
                  type: string
                  description: Optional raw input for BC Bid collector.
      responses:
        '200':
          description: Pipeline completed successfully
        '401':
          description: Unauthorized
        '500':
          description: Pipeline execution failed
  /digest:
    post:
      summary: Trigger weekly digest
      description: Sends a weekly digest of leads via email.
      security:
        - BearerAuth: []
      parameters:
        - name: to
          in: query
          description: Recipient email address (defaults to alvin@groupscout.ai)
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Digest sent successfully
        '401':
          description: Unauthorized
        '500':
          description: Failed to send digest
  /n8n/webhook:
    post:
      summary: Receive lead from n8n
      description: Endpoint for n8n to push new leads into the system.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lead'
      responses:
        '201':
          description: Lead created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  id:
                    type: string
        '400':
          description: Invalid JSON body
        '401':
          description: Unauthorized
        '500':
          description: Failed to store lead
  /api/leads:
    get:
      summary: List UI leads
      description: Returns filtered lead summaries for the operator inbox.
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
        - name: min_score
          in: query
          schema:
            type: integer
            minimum: 0
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lead summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadListResponse'
        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Failed to list leads
  /api/leads/{id}:
    get:
      summary: Get UI lead detail
      description: Returns safe lead detail and audit metadata without raw payload bodies.
      parameters:
        - $ref: '#/components/parameters/LeadID'
      responses:
        '200':
          description: Lead detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadDetailResponse'
        '404':
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Failed to load lead detail
    patch:
      summary: Update safe UI lead fields
      description: Updates current-schema operator fields. Phase 35 allows status and notes only.
      parameters:
        - $ref: '#/components/parameters/LeadID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadPatchRequest'
      responses:
        '200':
          description: Lead updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadPatchResponse'
        '400':
          description: Invalid JSON body, invalid allowed field, or unsupported unsafe field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Failed to update lead
  /api/leads/{id}/raw:
    get:
      summary: Get authenticated raw lead evidence
      description: Returns raw audit payload bytes for a lead. Requires bearer auth when API_TOKEN is configured.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LeadID'
      responses:
        '200':
          description: Raw audit payload
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Lead or raw audit payload not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Failed to load raw audit payload
  /api/leads/{id}/outreach:
    get:
      summary: List lead outreach
      parameters:
        - $ref: '#/components/parameters/LeadID'
      responses:
        '200':
          description: Outreach history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachListResponse'
        '404':
          description: Lead not found
    post:
      summary: Log lead outreach
      parameters:
        - $ref: '#/components/parameters/LeadID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutreachCreateRequest'
      responses:
        '201':
          description: Outreach logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachCreateResponse'
        '400':
          description: Invalid outreach payload
        '404':
          description: Lead not found
  /api/pipeline/runs:
    post:
      summary: Start asynchronous pipeline run
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineRunRequest'
      responses:
        '202':
          description: Pipeline run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRunAccepted'
    get:
      summary: List pipeline runs
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Pipeline run history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRunListResponse'
  /api/stats:
    get:
      summary: UI lead and outreach stats
      responses:
        '200':
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsSummary'
  /api/system:
    get:
      summary: UI system health
      responses:
        '200':
          description: Healthy or degraded UI system status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
  /slack/inventory:
    post:
      summary: Update room inventory (Slack Slash Command)
      description: Receives a numeric room count update from a Slack slash command.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Numeric room count (as a string from Slack form)
      responses:
        '200':
          description: Inventory updated successfully
        '400':
          description: Invalid room count or form parse failure
        '405':
          description: Method not allowed
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    LeadID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    APIError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: ok
        database:
          type: string
          example: ok
        ollama:
          type: string
          example: unavailable
      required:
        - status
        - database
        - ollama
    LeadSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        source:
          type: string
        location:
          type: string
        project_value:
          type: integer
          format: int64
        priority_score:
          type: integer
        priority_reason:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        has_raw:
          type: boolean
        audit_source_url:
          type: string
          format: uri
      required:
        - id
        - title
        - source
        - location
        - project_value
        - priority_score
        - priority_reason
        - status
        - created_at
        - updated_at
        - has_raw
    LeadListFilters:
      type: object
      properties:
        status:
          type: string
        source:
          type: string
        min_score:
          type: integer
        q:
          type: string
        limit:
          type: integer
        cursor:
          type: string
    LeadListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LeadSummary'
        next_cursor:
          type: string
        filters:
          $ref: '#/components/schemas/LeadListFilters'
      required:
        - items
        - next_cursor
        - filters
    LeadDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
        title:
          type: string
        location:
          type: string
        project_value:
          type: integer
          format: int64
        general_contractor:
          type: string
        applicant:
          type: string
        contractor:
          type: string
        source_url:
          type: string
          format: uri
        project_type:
          type: string
        estimated_crew_size:
          type: integer
        estimated_duration_months:
          type: integer
        out_of_town_crew_likely:
          type: boolean
        priority_score:
          type: integer
        priority_reason:
          type: string
        rationale:
          type: string
        suggested_outreach_timing:
          type: string
        notes:
          type: string
        owner:
          type: string
        snoozed_until:
          type: string
          format: date-time
          nullable: true
        flagged:
          type: boolean
        verification_state:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuditMetadata:
      type: object
      properties:
        has_raw:
          type: boolean
        raw_link:
          type: string
        payload_type:
          type: string
        source_url:
          type: string
          format: uri
        collector_name:
          type: string
        collected_at:
          type: string
          format: date-time
      required:
        - has_raw
    OutreachSummary:
      type: object
      properties:
        count:
          type: integer
        latest_at:
          type: string
          format: date-time
          nullable: true
      required:
        - count
        - latest_at
    OutreachEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lead_id:
          type: string
          format: uuid
        contact:
          type: string
        channel:
          type: string
        notes:
          type: string
        outcome:
          type: string
        logged_at:
          type: string
          format: date-time
    OutreachListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OutreachEvent'
        next_cursor:
          type: string
    OutreachCreateRequest:
      type: object
      properties:
        contact:
          type: string
        channel:
          type: string
        notes:
          type: string
        outcome:
          type: string
    OutreachCreateResponse:
      type: object
      properties:
        outreach:
          $ref: '#/components/schemas/OutreachEvent'
        lead:
          $ref: '#/components/schemas/LeadDetail'
    PipelineRunRequest:
      type: object
      properties:
        sources:
          type: array
          items:
            type: string
        bcbid_raw_input:
          type: string
        dry_run:
          type: boolean
    PipelineRunAccepted:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
        status:
          type: string
        started_at:
          type: string
          format: date-time
    PipelineRun:
      type: object
      properties:
        ID:
          type: string
        Status:
          type: string
        Sources:
          type: array
          items:
            type: string
        Counts:
          type: object
          additionalProperties:
            type: integer
        Errors:
          type: array
          items:
            type: string
        StartedAt:
          type: string
          format: date-time
        FinishedAt:
          type: string
          format: date-time
          nullable: true
    PipelineRunListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PipelineRun'
        next_cursor:
          type: string
    StatsSummary:
      type: object
      properties:
        Window:
          type: string
        ByStatus:
          type: object
          additionalProperties:
            type: integer
        BySource:
          type: object
          additionalProperties:
            type: integer
        ScoreBands:
          type: object
          additionalProperties:
            type: integer
        ByOwner:
          type: object
          additionalProperties:
            type: integer
        ByWeek:
          type: object
          additionalProperties:
            type: integer
        ByOutcome:
          type: object
          additionalProperties:
            type: integer
    SystemStatus:
      type: object
      properties:
        status:
          type: string
        database:
          type: object
        ollama:
          type: object
        metrics_available:
          type: boolean
        last_pipeline_run:
          nullable: true
    LeadDetailResponse:
      type: object
      properties:
        lead:
          $ref: '#/components/schemas/LeadDetail'
        audit:
          $ref: '#/components/schemas/AuditMetadata'
        outreach_summary:
          $ref: '#/components/schemas/OutreachSummary'
        activity:
          type: array
          items: {}
      required:
        - lead
        - audit
        - outreach_summary
        - activity
    LeadPatchRequest:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
        notes:
          type: string
        action:
          type: string
          enum:
            - claim
            - dismiss
            - snooze
            - flag
            - contacted
            - won
            - lost
            - no-response
            - reopen
        owner:
          type: string
        snoozed_until:
          type: string
          format: date-time
    LeadPatchResponse:
      type: object
      properties:
        lead:
          $ref: '#/components/schemas/LeadDetail'
        changed_fields:
          type: array
          items:
            type: string
            enum:
              - status
              - notes
        updated_at:
          type: string
          format: date-time
      required:
        - lead
        - changed_fields
        - updated_at
    Lead:
      type: object
      properties:
        ID:
          type: string
          format: uuid
        RawProjectID:
          type: string
        Source:
          type: string
        Title:
          type: string
        Location:
          type: string
        ProjectValue:
          type: integer
          format: int64
        GeneralContractor:
          type: string
        Applicant:
          type: string
        Contractor:
          type: string
        SourceURL:
          type: string
          format: uri
        ProjectType:
          type: string
        EstimatedCrewSize:
          type: integer
        EstimatedDurationMonths:
          type: integer
        OutOfTownCrewLikely:
          type: boolean
        PriorityScore:
          type: integer
        PriorityReason:
          type: string
        SuggestedOutreachTiming:
          type: string
        Notes:
          type: string
        Status:
          type: string
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
