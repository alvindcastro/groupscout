# Loads every dashboard JSON in deploy/config/grafana/dashboards (mounted at
# /etc/grafana/dashboards). Edit the JSON in git; UI changes are not saved.
apiVersion: 1

providers:
  - name: groupscout
    folder: GroupScout
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
