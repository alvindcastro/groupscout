# Ansible for the GroupScout host (IaC Phase 5, groupscout-site-6ah.6).
# Run from this directory:  ansible-playbook site.yml
# Runbook: groupscout-site backend/docs/guides/WSL_HOST.md.
[defaults]
inventory = inventory/home-wsl.yml
roles_path = roles
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = false
# Run notified handlers (e.g. the sshd restart) even if a later task fails.
force_handlers = true
interpreter_python = auto_silent

[ssh_connection]
pipelining = true
