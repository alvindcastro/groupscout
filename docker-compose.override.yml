# Local development overrides, auto-loaded by `docker compose` / `podman compose`
# when no -f flag is given. Builds the backend image locally and publishes the
# historical host ports. Production uses deploy/compose/compose.prod.yml instead.

x-local-build: &local-build
  context: .
  args:
    VERSION: ${GROUPSCOUT_VERSION:-dev}   # `make docker-up` passes the git SHA

services:
  groupscout:
    build: *local-build
    ports:
      - "8080:8080"

  alertd:
    build: *local-build
    ports:
      - "8081:8081"

  postgres:
    ports:
      - "5432:5432"

  n8n:
    ports:
      - "5678:5678"

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3000:3000"

  loki:
    ports:
      - "3100:3100"

  # ollama:
  #   ports:
  #     - "11434:11434"   # uncomment for local debugging only
